apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: microservices
  source:
    repoURL: https://github.com/shikhinmisra/spring-microservices-on-kubernetes-setup-on-laptop.git
    targetRevision: main
    path: k8s/apps/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: { prune: true, selfHeal: true }
