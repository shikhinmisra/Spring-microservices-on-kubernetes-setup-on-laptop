apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local laptop, backend only (default): product, order, inventory. Images from Harbor at localhost:30002.
# A CD pipeline only needs to bump `newTag` here; Argo CD then syncs the change.
namespace: default
resources:
  - ../../base/backend
images:
  - name: product-service
    newName: localhost:30002/microservices/product-service
    newTag: "1.0"
  - name: order-service
    newName: localhost:30002/microservices/order-service
    newTag: "1.0"
  - name: inventory-service
    newName: localhost:30002/microservices/inventory-service
    newTag: "1.0"
