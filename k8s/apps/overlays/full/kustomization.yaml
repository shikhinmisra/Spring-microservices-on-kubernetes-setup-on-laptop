apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Full system: backend + gateway + notification + frontend. Requires k8s/infrastructure/extras
# and roughly 8-10 GB for Docker Desktop.
namespace: default
resources:
  - ../../base/backend
  - ../../base/edge
images:
  - name: api-gateway
    newName: localhost:30002/microservices/api-gateway
    newTag: "1.0"
  - name: product-service
    newName: localhost:30002/microservices/product-service
    newTag: "1.0"
  - name: order-service
    newName: localhost:30002/microservices/order-service
    newTag: "1.0"
  - name: inventory-service
    newName: localhost:30002/microservices/inventory-service
    newTag: "1.0"
  - name: notification-service
    newName: localhost:30002/microservices/notification-service
    newTag: "1.0"
  - name: frontend
    newName: localhost:30002/microservices/frontend
    newTag: "1.0"
